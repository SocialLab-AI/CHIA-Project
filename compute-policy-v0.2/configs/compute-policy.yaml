policy_version: CP-01
currency: USD
gemini:
  total_budget_usd: 300
  reserve_usd: 30
  metering_required: true
  cache_reuse_recommended: true
tiers:
  dev:
    allowed_backends:
    - local
    - contabo
    max_parallel_jobs: 1
    gemini_allowed: true
    gemini_budget_usd: 5
    organizer_burst_allowed: false
    candidate_run_guidance: 1-5 tiny smoke/debug runs; counts are guidance, not a
      research sample size.
    notes: Real Gemini calls are allowed when needed; cache/replay responses while
      debugging parsers and orchestration.
  integration:
    allowed_backends:
    - local
    - contabo
    - development_cloud
    max_parallel_jobs: 2
    gemini_allowed: true
    gemini_budget_usd: 20
    organizer_burst_allowed: false
    candidate_run_guidance: Approximately 5-12 end-to-end candidates to prove knob
      propagation, validation, retry, and logging.
    notes: A stronger development VM is allowed when the team server is the bottleneck.
  pilot:
    allowed_backends:
    - contabo
    - development_cloud
    max_parallel_jobs: 4
    gemini_allowed: true
    gemini_budget_usd: 45
    organizer_burst_allowed: false
    candidate_run_guidance: Approximately 20-50 candidates, sized from measured runtime;
      enough to estimate cost, throughput, failure rate, and search behavior.
    notes: Freeze workload definitions, knob ranges, metric definitions, baseline,
      and correctness tolerance before pilot.
  final:
    allowed_backends:
    - organizer_burst
    max_parallel_jobs: 32
    gemini_allowed: true
    gemini_budget_usd: 200
    organizer_burst_allowed: true
    candidate_run_guidance: Final validated campaign sized from pilot evidence and
      available organizer capacity.
    notes: Run from a frozen commit and prompt version. Preserve $30 reserve for reproduction/recovery.
promotion_gates:
  dev_to_integration:
  - Experiment schema validation passes.
  - Attention kernel compiles and passes reference correctness on a tiny case.
  - gem5 executes the kernel and emits parseable statistics.
  - CHIA launches the job and persists a result record.
  - At least one real Gemini request can be parsed and deterministically validated.
  integration_to_pilot:
  - At least five distinct valid configurations complete end-to-end.
  - Hardware and software knobs are proven to propagate to the intended simulator/kernel
    controls.
  - Invalid and duplicate agent proposals are rejected before execution.
  - Retry/failure logging works.
  - Gemini token/cost and gem5 wall-time per candidate can be estimated.
  pilot_to_final:
  - Workload definition, knob ranges, correctness tolerance, metrics, baseline, and
    search budget are frozen.
  - Pilot produces stable cost/runtime/failure estimates.
  - Final Gemini cost and compute demand are forecast from pilot evidence.
  - Resume/restart behavior is tested.
  - Exact Git commit, tool versions, seeds, and prompt version are recorded.
  - Pareto/baseline analysis pipeline runs on pilot outputs.

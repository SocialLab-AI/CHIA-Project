[project]
name = "chia-project"
version = "0.1.0"
description = "CHIA-driven Llama tutor and gem5 attention-kernel co-design prototype"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cluster = ["chialoops==1.0.1", "ray[default]==2.54.0"]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["scheduling: opt-in actual local CHIA/Ray scheduling"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

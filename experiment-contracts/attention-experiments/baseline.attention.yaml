# Team-provided gem5 + attention baseline.
# These are the current reference values, not all active CHIA knobs.
schema_version: "0.2.0"

metadata:
  experiment_id: attn-baseline-001
  campaign_id: attention-baseline-v1
  description: "Verified baseline candidate for the attention-kernel gem5 path."

workload:
  context_tokens: 512
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1

software:
  implementation: AttentionKernelQuantizedKV
  kv_format: FP32
  threads: 1

hardware:
  cpu_model: RiscvO3CPU
  cores: 2
  frequency_ghz: 1
  issue_width: 2
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_cache_kib: 64
  l1d_associativity: 4
  l1d_latency_cycles: 2
  l2_cache_kib: 1024
  l2_associativity: 8
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE

measurement:
  repetitions: 4
  warmup_runs: 0
  max_simulation_instructions: null

status:
  state: validated
  message: "Baseline structure reflects the teammate-supplied current configuration; implementation support still governs runnability."

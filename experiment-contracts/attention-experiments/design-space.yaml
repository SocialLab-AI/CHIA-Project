# Search-space contract.
# "active_candidates" are values CHIA may vary now.
# "evaluation_axes" change workload scale and should normally be compared as separate conditions.
# "fixed" values are recorded controls.
# "future" values are not active until implementation/mapping is validated.
schema_version: "0.2.0"

baseline:
  cpu_model: RiscvO3CPU
  cores: 2
  frequency_ghz: 1
  issue_width: 2
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_cache_kib: 64
  l1d_associativity: 4
  l1d_latency_cycles: 2
  l2_cache_kib: 1024
  l2_associativity: 8
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE
  context_tokens: 512
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1
  threads: 1
  repetitions: 4
  warmup_runs: 0
  kv_format: FP32

active_candidates:
  hardware:
    cpu_model: [RiscvTimingSimpleCPU, RiscvO3CPU]
    cores: [1, 2, 4]
    frequency_ghz: [1, 2, 3, 4]
    issue_width: [1, 2, 4]
    l1d_cache_kib: [16, 32, 64]
    l1d_associativity: [2, 4, 8]
    l2_cache_kib: [256, 512, 1024]
    l2_associativity: [4, 8, 16]
  software:
    kv_format: [FP32, Q4]

evaluation_axes:
  context_tokens: [128, 256, 512]

fixed:
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_latency_cycles: 2
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1
  threads: 1
  repetitions: 4
  warmup_runs: 0

future:
  kv_format: [FP16, Q8]
  memory_type: "future: DDR4 is not yet validated / out of current schema"
  attention_block_size: "future: not implemented"
  memory_latency: "future: map to valid gem5 DRAM parameters"
  memory_bandwidth: "future: depends on selected gem5 memory configuration"
  context_tokens_extended: [1024, 2048, 4096]
  threads: "future: requires a parallel kernel implementation"

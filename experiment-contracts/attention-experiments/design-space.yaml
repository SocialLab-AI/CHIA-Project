# CHIA may vary active_candidates. Evaluation axes are compared separately.
# Fixed and future values are not active optimization knobs.
schema_version: "0.2.0"
metrics_contract: "attention-experiment.schema.json#/$defs/gem5_metrics"

baseline:
  cpu_model: RiscvO3CPU
  cores: 2
  frequency_ghz: 1
  issue_width: 2
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_cache_kib: 64
  l1d_associativity: 4
  l1d_latency_cycles: 2
  l2_cache_kib: 1024
  l2_associativity: 8
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE
  context_tokens: 512
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1
  threads: 2
  repetitions: 10
  warmup_runs: 0
  kv_format: Q4

active_candidates:
  hardware:
    cpu_model: [RiscvTimingSimpleCPU, RiscvO3CPU]
    frequency_ghz: [1, 2, 3, 4]
    issue_width: [1, 2, 4]
    l1d_cache_kib: [16, 32, 64]
    l1d_associativity: [2, 4, 8]
    l2_cache_kib: [256, 512, 1024]
    l2_associativity: [4, 8, 16]

evaluation_axes:
  context_tokens: [128, 256, 512]

fixed:
  cores: 2
  kv_format: Q4
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_latency_cycles: 2
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1
  threads: 2
  repetitions: 10
  warmup_runs: 0

constraints:
  - "RiscvTimingSimpleCPU requires issue_width == 1"
  - "Q4 packs two signed 4-bit K/V values per byte and uses FP32 scales"

future:
  software_search: "pending team decision"
  core_count: [1, 4]  # deferred until thread/core partitioning is generalized
  kv_format: [FP16, Q8]
  memory_type: "DDR4 requires validation before activation"
  attention_block_size: "not implemented"
  memory_latency: "requires mapping to valid gem5 DRAM parameters"
  memory_bandwidth: "depends on the selected gem5 memory model"
  context_tokens_extended: [1024, 2048, 4096]
  threads_extended: "thread counts beyond 2 require generalized workload partitioning"

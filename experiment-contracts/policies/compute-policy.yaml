policy_version: "0.2.0"

gemini:
  budget_usd: 300
  metering_required: true
  models:
    gemini-3.1-flash-lite:
      input_usd_per_million_tokens: 0.25
      output_usd_per_million_tokens: 1.50
    # Reviewed 2026-09-22: https://ai.google.dev/gemini-api/docs/pricing
    # These rates estimate campaign cost; they are not verified billing data.
    gemini-3.8-flash:
      input_usd_per_million_tokens: 0.75
      output_usd_per_million_tokens: 3.75

tiers:
  dev:
    backends:
      - local
      - contabo
    max_parallel_jobs: 1
    gemini_allowed: true
    organizer_burst_allowed: false

  integration:
    backends:
      - local
      - contabo
    max_parallel_jobs: 2
    gemini_allowed: true
    organizer_burst_allowed: false

  pilot:
    backends:
      - contabo
      - gcp
    max_parallel_jobs: 4
    gemini_allowed: true
    organizer_burst_allowed: false

  final:
    backends:
      - organizer_burst
    max_parallel_jobs: 32
    gemini_allowed: true
    organizer_burst_allowed: true

# Repeated Issue #60 comparison. Copy to an ignored *.local.yaml before use.
experiment_id: qwen-proxy-comparison-v1
contexts: [128, 256, 512, 1024, 2048]
trials_per_context: 3
results_root: results/proxy-comparison

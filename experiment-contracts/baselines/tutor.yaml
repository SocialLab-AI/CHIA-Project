schema_version: "0.2.0"

metadata:
  experiment_id: "tutor-baseline-001"
  description: >
    Offline AI Tutor baseline using Qwen2.5 0.5B Instruct Q5_K_M.
  artifact_manifest: "server-local artifact verified by SHA-256 at runtime"

workload:
  dataset_id: "openstax-aligned-team-assessment-250-v1"
  evaluation_protocol: "exact-option-text-accuracy-v1"
  num_questions: 250
  seed: 42

software:
  model: "Qwen2.5 0.5B Instruct"
  quantization: "Q5_K_M"
  backend: "llama.cpp / CPU"

  cpu_threads: 4
  batch_size: 1

  temperature: 0.0
  max_output_tokens: 384

  runtime_ready: true
  status: "runtime_verified"

  description: >
    Verified CPU baseline served by llama.cpp. The committed
    contract records the logical artifact; the absolute server path stays
    in an ignored local campaign file.

  unresolved_fields: []

evaluation:
  questions_file: "data/questions/questions.json"
  references_file: "data/references/answer_key.json"

  reference_source: "Team-authored 250-question assessment aligned to OpenStax topic scope"
  source_url: "https://openstax.org/"
  license: "Team-authored evaluation material; repository use authorized by contributor"
  reference_visible_to_model: false

  comparison_method: "exact_option_text_accuracy"
  similarity_metric: "normalized_exact_option_text"

  sample_limit: 250

proxy_evaluation:
  type: "attention_kernel"
  mapping_id: "qwen25-gqa-14-2-64-q4-v1"
  attention_experiment_ref: "experiment-contracts/baselines/attention.yaml"

metrics:
  application:
    answer_quality: null
    latency_ms: null
    memory_mb: null
    throughput_qps: null

status:
  state: "validated"
  message: >
    Software baseline values are resolved.
    Runtime adapter and the five-subject 250-question evaluation set are implemented.

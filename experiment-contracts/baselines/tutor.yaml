schema_version: "0.2.0"

metadata:
  experiment_id: "tutor-baseline-001"
  description: >
    Offline AI Tutor baseline using Qwen2.5 0.5B Instruct Q5_K_M.
  artifact_manifest: "server-local artifact verified by SHA-256 at runtime"

workload:
  dataset_id: "edge-ai-tutor-mixed-qa-v2-100q"
  evaluation_protocol: "required-concept-coverage-v1"
  num_questions: 100
  seed: 42

software:
  model: "Qwen2.5 0.5B Instruct"
  quantization: "Q5_K_M"
  backend: "llama.cpp / CPU"

  cpu_threads: 4
  batch_size: 1

  temperature: 0.0
  max_output_tokens: 384

  runtime_ready: true
  status: "runtime_verified"

  description: >
    Verified CPU baseline served by llama.cpp. The committed
    contract records the logical artifact; the absolute server path stays
    in an ignored local campaign file.

  unresolved_fields: []

evaluation:
  questions_file: "data/questions/questions.json"
  references_file: "data/references/openstax.json"

  reference_source: "user_curated_mixed_qa"
  reference_visible_to_model: false

  comparison_method: "required_concept_coverage"
  similarity_metric: "matched_required_concept_groups"

  sample_limit: 100

proxy_evaluation:
  type: "attention_kernel"
  mapping_id: "placeholder:tutor-to-attention-v1"
  attention_experiment_ref: null

metrics:
  application:
    answer_quality: null
    latency_ms: null
    memory_mb: null
    throughput_qps: null

status:
  state: "planned"
  message: >
    Software baseline values are resolved.
    Runtime adapter and mixed educational QA evaluation set are implemented.

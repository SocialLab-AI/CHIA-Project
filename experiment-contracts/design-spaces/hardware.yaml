# Schema: schemas/chia-experiment.schema.yaml#/$defs/hardware_design_space
# CHIA may vary active_candidates. Evaluation axes are compared separately.
# Fixed and future values are not active optimization knobs.
schema_version: "0.2.0"
metrics_contract: "schemas/chia-experiment.schema.yaml#/$defs/gem5_metrics"

baseline:
  cpu_model: RiscvO3CPU
  cores: 2
  frequency_ghz: 1
  issue_width: 2
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_cache_kib: 64
  l1d_associativity: 4
  l1d_latency_cycles: 2
  l2_cache_kib: 1024
  l2_associativity: 8
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE
  context_tokens: 512
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1
  threads: 2
  repetitions: 10
  warmup_runs: 0
  kv_format: Q4

active_candidates:
  hardware:
    cpu_model: [RiscvTimingSimpleCPU, RiscvO3CPU]
    frequency_ghz: [1, 2, 3, 4]
    issue_width: [1, 2, 4]
    l1d_cache_kib: [16, 32, 64]
    l1d_associativity: [2, 4, 8]
    l2_cache_kib: [256, 512, 1024]
    l2_associativity: [4, 8, 16]

evaluation_axes:
  # Issue #60 calibration axis; these are workloads, not optimization knobs.
  context_tokens: [128, 256, 512, 1024, 2048]

fixed:
  cores: 2
  kv_format: Q4
  l1i_cache_kib: 16
  l1i_associativity: 2
  l1i_latency_cycles: 2
  l1d_latency_cycles: 2
  l2_latency_cycles: 20
  memory_type: DDR3_1600_8x8
  memory_size_mib: 16
  simulation_mode: SE
  query_heads: 4
  kv_heads: 2
  head_dimension: 32
  layers: 1
  threads: 2
  repetitions: 10
  warmup_runs: 0

constraints:
  - "Simulation mode is SE only; Full System mode is unsupported."
  - "RiscvTimingSimpleCPU requires issue_width = 1."
  - "Software threads must not exceed hardware cores."
  - "Memory bus and controller frequencies are fixed with DDR3_1600_8x8."
  - "Total cores in initial campaign are restricted to 2."

future:
  core_exploration: [1, 4]
  quantization: [FP16, Q8]
  memory_types: [LPDDR4_3200_2x16, DDR4_2400_8x8]

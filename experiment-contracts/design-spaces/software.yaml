schema_version: "0.2.0"

description: >
  AI Tutor software design space.
  The initial software configuration is fixed for baseline
  co-design experiments. Optimization search ranges may be
  introduced separately later.

baseline:
  model: "Llama 3.2 1B Instruct"
  quantization: "Q4_K_M"
  backend: "llama.cpp / CPU"

  cpu_threads: 4
  batch_size: 1

  temperature: 0.0
  max_output_tokens: 384

  runtime_ready: false
  status: "baseline_resolved"


fixed:
  model: "Llama 3.2 1B Instruct"
  quantization: "Q4_K_M"
  backend: "llama.cpp / CPU"

  cpu_threads: 4
  batch_size: 1

  temperature: 0.0
  max_output_tokens: 384

active_candidates: {}


pending_search_space:
  status: "pending_definition"
  description: >
    Software optimization search ranges have not yet been defined.
    Initial experiments use the resolved fixed baseline.

  knobs:
    - name: "temperature"
      baseline_value: 0.0
      unit: "unitless"
      status: "baseline_resolved"
      intended_purpose: "Sampling temperature for answer generation"

    - name: "quantization"
      baseline_value: "Q4_K_M"
      status: "baseline_resolved"
      intended_purpose: "Model weight quantization"


optimization_metrics:
  answer_quality:
    direction: "maximize"
    intended_purpose: "Native OpenStax QA accuracy / reviewer score"

  latency_ms:
    direction: "minimize"
    intended_purpose: "Application response latency"


unresolved_runtime_items:
  - "exact Llama 3.2 1B Instruct GGUF artifact path"
  - "exact OpenStax evaluation dataset/subset/artifact"
  - "llama.cpp batch-size runtime mapping semantics / adapter mapping"

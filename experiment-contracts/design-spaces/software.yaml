# Schema: schemas/chia-experiment.schema.yaml#/$defs/software_design_space
schema_version: "0.2.0"

description: "AI Tutor software design space. Software search is recorded as pending; the supplied baseline is fixed for initial co-design comparison."

baseline:
  model: "Llama 3.2 1B Instruct"
  quantization: "Q4_K_M"
  backend: "llama.cpp / CPU"
  cpu_threads: 4
  batch_size: 1
  temperature: 0.0
  max_output_tokens: 384
  embedding_model: "MiniLM-L6-dot-v1"
  embedding_dimension: 384
  retrieval_method: "Semantic similarity"
  top_k: 2
  chunk_size: 1500
  chunk_overlap: 200
  chunk_unit: "characters"
  runtime_ready: false
  status: "draft"

fixed:
  model: "Llama 3.2 1B Instruct"
  quantization: "Q4_K_M"
  backend: "llama.cpp / CPU"
  cpu_threads: 4
  batch_size: 1
  temperature: 0.0
  max_output_tokens: 384
  embedding_model: "MiniLM-L6-dot-v1"
  embedding_dimension: 384
  retrieval_method: "Semantic similarity"
  top_k: 2
  chunk_size: 1500
  chunk_overlap: 200
  chunk_unit: "characters"

active_candidates: {}

pending_search_space:
  status: "pending_definition"
  description: "Optimization search space over software knobs is deferred; initial baseline is fixed."
  knobs:
    - name: "temperature"
      unit: "unitless"
      status: "pending_definition"
      intended_purpose: "Sampling temperature for answer generation"
    - name: "chunk_overlap"
      unit: "characters"
      status: "pending_definition"
      intended_purpose: "Character overlap between adjacent chunks in RAG indexing"
    - name: "similarity_metric"
      status: "pending_definition"
      intended_purpose: "Vector similarity metric for RAG retrieval"
    - name: "quantization"
      status: "pending_definition"
      intended_purpose: "Model weight quantization"

optimization_metrics:
  answer_quality:
    direction: "maximize"
    intended_purpose: "Native OpenStax QA accuracy / reviewer score"
  latency_ms:
    direction: "minimize"
    intended_purpose: "Application response latency"

unresolved_runtime_items:
  - "Llama 3.2 1B Instruct GGUF model artifact location"
  - "MiniLM-L6-dot-v1 embedding weights artifact location"
  - "OpenStax evaluation questions and answers dataset"
  - "llama.cpp batch size runtime mapping semantics"
  - "Vector similarity distance implementation"

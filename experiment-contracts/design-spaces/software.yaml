schema_version: "0.2.0"

description: >
  Executable AI Tutor software design space. Model identity,
  quantization, backend, threads and request concurrency are fixed;
  Gemini may choose only the reviewed sampling and output limits.

baseline:
  model: "Qwen2.5 0.5B Instruct"
  quantization: "Q5_K_M"
  backend: "llama.cpp / CPU"

  cpu_threads: 4
  batch_size: 1

  temperature: 0.0
  max_output_tokens: 384

  runtime_ready: true
  status: "runtime_verified"


fixed:
  model: "Qwen2.5 0.5B Instruct"
  quantization: "Q5_K_M"
  backend: "llama.cpp / CPU"

  cpu_threads: 4
  batch_size: 1

active_candidates:
  temperature: [0.0, 0.2, 0.5]
  max_output_tokens: [128, 256, 384]

pending_search_space:
  status: "resolved_for_integration"
  description: >
    The integration campaign searches only temperature and maximum
    output length. Model artifacts and runtime topology remain fixed.

  knobs:
    - name: "temperature"
      baseline_value: 0.0
      unit: "unitless"
      status: "active"
      intended_purpose: "Sampling temperature for answer generation"

    - name: "quantization"
      baseline_value: "Q5_K_M"
      status: "fixed"
      intended_purpose: "Model weight quantization"


optimization_metrics:
  answer_quality:
    direction: "maximize"
    intended_purpose: "Native OpenStax QA accuracy / reviewer score"

  latency_ms:
    direction: "minimize"
    intended_purpose: "Application response latency"

  energy_uj:
    direction: "minimize"
    intended_purpose: "Estimated proxy cache dynamic energy"


unresolved_runtime_items: []

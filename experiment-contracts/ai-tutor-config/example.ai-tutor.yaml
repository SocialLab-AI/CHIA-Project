# Application-level AI Tutor baseline configuration.
# Conforms to the user-supplied software baseline (Llama 3.2 1B Instruct, Q4_K_M, llama.cpp / CPU).
# Schema-valid draft configuration (runtime_ready: false).
schema_version: "0.2.0"

metadata:
  experiment_id: tutor-baseline-001
  description: "Offline AI Tutor baseline using Llama 3.2 1B Instruct with MiniLM-L6-dot-v1 RAG pipeline."
  artifact_manifest: null

workload:
  dataset_id: "placeholder:tutor-science-questions-v1"
  corpus_id: "placeholder:science-textbook-index-v1"
  evaluation_protocol: "placeholder:tutor-evaluation-v1"
  num_questions: 20
  seed: 42

software:
  model: "Llama 3.2 1B Instruct"
  quantization: "Q4_K_M"
  backend: "llama.cpp / CPU"
  cpu_threads: 4
  batch_size: 1
  temperature: 0.0
  max_output_tokens: 384
  embedding_model: "MiniLM-L6-dot-v1"
  embedding_dimension: 384
  retrieval_method: "Semantic similarity"
  top_k: 2
  chunk_size: 1500
  chunk_overlap: 200
  chunk_unit: "characters"
  runtime_ready: false
  status: "draft"
  description: "User-supplied AI Tutor software baseline. Execution readiness remains false pending model artifact resolution and adapter implementation."
  unresolved_fields:
    - "exact model/GGUF artifact path"
    - "exact embedding artifact identifier"
    - "exact corpus artifact path"
    - "runtime batch size semantics (not mapped to llama.cpp n_batch)"
    - "semantic similarity distance function implementation (cosine vs dot product unresolved)"

evaluation:
  questions_file: "data/questions/questions.json"
  references_file: "data/references/openstax.json"
  reference_source: "openstax"
  reference_visible_to_model: false
  comparison_method: "semantic_similarity"
  sample_limit: 50

proxy_evaluation:
  type: attention_kernel
  mapping_id: "placeholder:tutor-to-attention-v1"
  attention_experiment_ref: null

metrics:
  application:
    answer_quality: null
    latency_ms: null
    memory_mb: null
    throughput_qps: null

status:
  state: planned
  message: "Software baseline draft. Replace placeholders and validate runtime adapters before execution."
